<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>
    <title>Operaciones Matemáticas</title>
    <link rel="shortcut icon" href="./operations-colored-icons-by-Vexels.png" type="image/x-icon">
    <style type="text/tailwindcss">
        @import "tailwindcss"; 
        </style>
</head>

<body class="bg-gradient-to-b from-black via-red-500 to-slate-950 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl w-full max-w-[85vw] md:max-w-[55vw] shadow-2xl">
        <h2 class="text-xl font-bold text-red-500 mb-6 text-center">
            Operaciones Matemáticas
        </h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-600 font-medium">Introduce un número</label>
                <input type="number" id="numero1" class="w-full mt-1 p-3 border border-gray-300 rounded-lg"
                    placeholder="Ej: 10">
            </div>
            <div>
                <label class="block text-sm text-slate-600 font-medium">Introduce otro número</label>
                <input type="number" id="numero2" class="w-full mt-1 p-3 border border-gray-300 rounded-lg"
                    placeholder="Ej: 8">
            </div>

            <div>
                <p>
                    <label for="seleccion" class="block text-sm text-slate-600 font-medium">Selecciona: </label>
                    <select id="operacion" class="w-full mt-1 p-3 border border-gray-300 rounded-lg">
                        <optgroup label="Operaciones">
                            <option value="1">Sumar</option>
                            <option value="2">Restar</option>
                            <option value="3">Multiplicar</option>
                            <option value="4">Dividir</option>
                        </optgroup>
                    </select>
                </p>
            </div>

            <button onclick="operar()"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 mt-5 rounded-lg transition-colors">
                Operar
            </button>
        </div>

        <p id="resultado" class="mt-6 p-4 rounded-lg text-red-500 font-semibold text-center"></p>
    </div>


    <script src="./app.js"></script>
</body>

</html>
